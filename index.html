:root{--green:#5BA888;--green-d:#4A8C70;--green-l:#8DD5B0;--green-s:#E0F3E9;--green-bg:#F2F9F4;--green-t:#2D5C46;--orange:#FF9F43;--orange-s:#FFF3E0;--blue:#4A90D9;--blue-s:#E3F2FD;--red:#FF6B6B;--purple:#AB47BC;--purple-s:#F3E5F5;--text:#1a1a1a;--text2:#555;--text3:#999;--card:#fff;--border:#f0f0f0;--r:14px;--sh:0 1px 6px rgba(91,168,136,.08);--sh2:0 2px 12px rgba(91,168,136,.12);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

html,body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:var(--green-bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s}body{min-height:100vh}
::-webkit-scrollbar{display:none}
.hdr{background:var(--green);padding:calc(var(--st)+10px) 14px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;color:#fff;border-radius:0 0 20px 20px;box-shadow:0 2px 8px rgba(91,168,136,.2)}
.hdr .menu{background:rgba(255,255,255,.2);border:none;width:36px;height:36px;border-radius:10px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr .tt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}

.dbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;opacity:0;pointer-events:none;transition:.3s}.dbg.on{opacity:1;pointer-events:auto}

<body>
<div class="hdr">

</div>

<div class="dr" id="dr"><div class="dr-h">📊 运营管理</div><div id="dn"></div></div>

<script>
// ========== 基础工具 ==========
const DB={
  get:(k,d)=>{try{const v=localStorage.getItem('oz_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>localStorage.setItem('oz_'+k,JSON.stringify(v)),
  del:k=>localStorage.removeItem('oz_'+k)
};
const todayStr=()=>new Date().toISOString().split('T')[0];
const gid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,5);
const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const showToast=msg=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};

// ========== 本地提醒通知系统 ==========
const REMINDER={
  // 检查通知权限并请求
  ensure:function(){
    if(!('Notification'in window))return false;
    if(Notification.permission==='granted')return true;
    if(Notification.permission==='default'){Notification.requestPermission();return false}
    return false;
  },
  // 发一条通知（带图标与点击跳转）
  fire:function(title,body,tag){
    if(!REMINDER.ensure())return;
    try{
      const n=new Notification(title,{body:body,tag:tag,icon:'icon-192.png'});
      n.onclick=function(){n.close();window.focus()};
    }catch(e){}
  },
  // 检查"是否已提醒过该事件"，用日期做去重
  firedToday:function(key){
    const today=DB.get('reminderLog',{});
    return today[key]===todayStr();
  },
  markFired:function(key){
    const today=DB.get('reminderLog',{});
    today[key]=todayStr();DB.set('reminderLog',today);
  },
  // 每日 09:00 晨报（只在当天首次启动时推送一次）
  morningDigest:function(){
    if(REMINDER.firedToday('digest'))return;
    const cfg=DB.get('remindCfg',{});
    if(cfg.digest===false)return;
    const orders=DB.get('orders_manual',[]);
    const pending=orders.filter(o=>o.status==='pending').length;
    const hist=getKPIHistory(2);const yesterday=hist[0]||{};
    const tasks=DB.get('tasks',[]).filter(t=>t.date===todayStr()&&!t.done).length;
    const line1='📦 待发货 '+pending+' 单 · 待办任务 '+tasks+' 个';
    const line2='昨日 GMV ₽'+(yesterday.gmv||0)+' · 订单 '+(yesterday.orders||0);
    REMINDER.fire('☀️ 早上好，今日卖家晨报',line1+'\n'+line2,'digest');
    REMINDER.markFired('digest');
  },
  // 待发货订单提醒（每小时，有未发货就提醒）
  pendingCheck:function(){
    const cfg=DB.get('remindCfg',{});
    if(cfg.orders===false)return;
    if(REMINDER.firedToday('orders'))return;
    const orders=DB.get('orders_manual',[]);
    const pending=orders.filter(o=>o.status==='pending').length;
    if(pending>0){
      REMINDER.fire('📦 '+pending+' 单待发货','有订单尚未处理发货，请及时安排','orders');
      REMINDER.markFired('orders');
    }
  },
  // 差评监控提醒
  reviewCheck:function(){
    const cfg=DB.get('remindCfg',{});
    if(cfg.reviews===false)return;
    if(REMINDER.firedToday('reviews'))return;
    const r=DB.get('reviews',{});
    const today=reviews_today();
    // reviews 里存的是复盘数据，这里用自定义 reviewAlert 标记差评
    const alerts=DB.get('reviewAlerts',[]);
    const bad=alerts.filter(a=>a.date===todayStr()&&a.level<=2).length;
    if(bad>0){
      REMINDER.fire('⚠️ 有 '+bad+' 条低分评价','请及时查看并处理差评','reviews');
      REMINDER.markFired('reviews');
    }
  },
  // 每日复盘提醒（21:00 后）
  reviewDone:function(){
    const cfg=DB.get('remindCfg',{});
    if(cfg.reviewDone===false)return;
    if(REMINDER.firedToday('reviewDone'))return;
    const reviews=DB.get('reviews',{});
    if(!reviews[todayStr()]){
      REMINDER.fire('📋 今日复盘还没做','花2分钟记录今日GMV、完成情况与明日计划','reviewDone');
      REMINDER.markFired('reviewDone');
    }
  },
  // 主检查：被定时器调用
  run:function(){
    if(!REMINDER.ensure())return;
    REMINDER.morningDigest();
    REMINDER.pendingCheck();
    REMINDER.reviewCheck();
    REMINDER.reviewDone();
  }
};
function reviews_today(){return todayStr()}

// ========== Ozon API 对接 ==========
const OZON_API='https://api-seller.ozon.ru';
// CORS代理：通过Cloudflare Worker转发请求
const CORS_PROXY='https://ozon-api-proxy.workbuddy.workers.dev/';

async function ozonAPI(endpoint,body){
  const creds=DB.get('ozonCreds',{clientId:'',apiKey:''});
  if(!creds.clientId||!creds.apiKey){showToast('⚠️ 请先在设置页配置API');return null}
  try{
    const url=CORS_PROXY+endpoint;
    const resp=await fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json','Client-Id':creds.clientId,'Api-Key':creds.apiKey},
      body:JSON.stringify(body||{})
    });
    const data=await resp.json();
    if(data.error){showToast('API错误: '+(data.error.message||'未知'));return null}
    return data.result||data;
  }catch(e){
    showToast('网络错误，请稍后重试');
    return null;
  }
}

// 手动录入数据模式（API不可用时的降级方案）
function saveManualKPI(data){
  const all=DB.get('manualKPI',{});
  all[todayStr()]=Object.assign(all[todayStr()]||{},data,{date:todayStr()});
  DB.set('manualKPI',all);
}
function getKPIHistory(days){
  const all=DB.get('manualKPI',{});
  const result=[];const now=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const dk=d.toISOString().split('T')[0];
    result.push(Object.assign({date:dk,gmv:0,orders:0,views:0,visitors:0},all[dk]||{}));
  }
  return result;
}

const MENUS=[
  {id:'dashboard',e:'📊',t:'数据看板',g:'运营'},
  {id:'selection',e:'🛒',t:'选品上架',g:'运营'},

  {id:'life',e:'🥗',t:'运动饮食',g:'生活'},

// ========== 数据初始化 ==========
function initData(){
  if(!DB.get('tasks'))DB.set('tasks',[]);
  if(!DB.get('products'))DB.set('products',[]);
  if(!DB.get('orders_manual'))DB.set('orders_manual',[]);
  if(!DB.get('finances'))DB.set('finances',[]);
  if(!DB.get('meals'))DB.set('meals',[]);
  if(!DB.get('exercise'))DB.set('exercise',[]);
  if(!DB.get('reviews'))DB.set('reviews',{});
  if(!DB.get('checkin'))DB.set('checkin',[]);
  if(!DB.get('engProgress'))DB.set('engProgress',{day:0,date:''});
  if(!DB.get('ozonCreds'))DB.set('ozonCreds',{clientId:'',apiKey:''});
  // 每天自动生成默认任务
  const tk=todayStr();const tasks=DB.get('tasks');
  if(!tasks.some(t=>t.date===tk)){
    tasks.push(
      {id:gid(),name:'检查Ozon店铺数据（GMV/订单/转化）',time:'09:00',done:false,date:tk,cat:'运营'},
      {id:gid(),name:'选品调研+上架新品',time:'10:00',done:false,date:tk,cat:'运营'},
      {id:gid(),name:'处理待发货订单',time:'14:00',done:false,date:tk,cat:'运营'},
      {id:gid(),name:'广告投放优化（ACoS调整）',time:'15:00',done:false,date:tk,cat:'运营'},
      {id:gid(),name:'学习俄语/英语20分钟',time:'20:00',done:false,date:tk,cat:'学习'}
    );
    DB.set('tasks',tasks);
  }
  // 金句按日期轮换
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
  DB.set('quoteIdx',doy);
}

// ========== 金句 ==========
const QUOTES=[
  {cn:'选品决定生死，运营决定高度。',en:'Product selection determines survival, operations determine height.'},
  {cn:'数据不会说谎，学会用数据驱动决策。',en:'Data never lies, let it drive your decisions.'},

RENDER.dashboard=function(){
  document.getElementById('hdr-d').textContent=todayStr();
  const creds=DB.get('ozonCreds',{clientId:'',apiKey:''});
  const apiOk=creds.clientId&&creds.apiKey;
  const hist=getKPIHistory(7);
  const today=hist[hist.length-1]||{};
  const yest=hist[hist.length-2]||{};
  const weekGMV=hist.reduce((s,d)=>s+(d.gmv||0),0);
  const weekOrders=hist.reduce((s,d)=>s+(d.orders||0),0);
  const weekViews=hist.reduce((s,d)=>s+(d.views||0),0);
  const avgOrderValue=weekOrders?Math.round(weekGMV/weekOrders):0;
  const weekCVR=weekViews?Math.round(weekOrders/weekViews*1000)/10:0;
  let html='<div class="cd cd-green"><div style="font-size:14px;">📊 今日数据看板</div><div style="font-size:12px;opacity:.85;margin-top:4px;">';
  html+=apiOk?'✅ Ozon API已连接 · 数据自动同步':'⚠️ API未配置 · 点击设置页配置';
  html+='</div></div>';

  // KPI卡片
  html+='<div class="stats"><div class="stat"><div class="n">'+(today.gmv||0)+'</div><div class="l">今日GMV(₽)</div></div><div class="stat"><div class="n">'+(today.orders||0)+'</div><div class="l">今日订单</div></div><div class="stat"><div class="n">'+(today.views||0)+'</div><div class="l">今日浏览</div></div></div>';

  // 趋势
  const gmvTrend=yest.gmv?Math.round((today.gmv-yest.gmv)/yest.gmv*100):0;
  const ordTrend=yest.orders?Math.round((today.orders-yest.orders)/yest.orders*100):0;
  html+='<div class="kpi-card"><div class="kpi-row"><span class="kpi-label">📈 GMV趋势</span><span class="kpi-trend '+(gmvTrend>=0?'up':'down')+'">'+(gmvTrend>=0?'↑':'↓')+Math.abs(gmvTrend)+'%</span></div><div class="kpi-val">₽'+(today.gmv||0).toLocaleString()+'</div><div class="kpi-sub">昨日 ₽'+(yest.gmv||0).toLocaleString()+' · 本周 ₽'+weekGMV.toLocaleString()+'</div></div>';
  html+='<div class="kpi-card"><div class="kpi-row"><span class="kpi-label">📦 订单趋势</span><span class="kpi-trend '+(ordTrend>=0?'up':'down')+'">'+(ordTrend>=0?'↑':'↓')+Math.abs(ordTrend)+'%</span></div><div class="kpi-val">'+(today.orders||0)+'单</div><div class="kpi-sub">昨日 '+(yest.orders||0)+'单 · 本周'+weekOrders+'单</div></div>';

  // 7天柱状图
  const maxGMV=0;
  // 7天SVG趋势图
  html+='<div class="cd"><div style="font-size:13px;font-weight:600;margin-bottom:8px;">📊 近7天GMV趋势</div>';
  const W=320,H=120,pad=8;
  const gmvArr=hist.map(d=>d.gmv||0);
  const maxV=Math.max(...gmvArr,1);
  const minV=Math.min(...gmvArr,0);
  const range=maxV-minV||1;
  const stepX=(W-pad*2)/(gmvArr.length-1||1);
  const pts=gmvArr.map((v,i)=>(pad+stepX*i)+','+(H-pad-((v-minV)/range)*(H-pad*2)));
  const linePts=pts.join(' ');
  const areaPts=pad+','+H+' '+pts.join(' ')+' '+(W-pad)+','+H;
  // 平均线
  const avg=Math.round(gmvArr.reduce((s,v)=>s+v,0)/gmvArr.length);
  const avgY=H-pad-((avg-minV)/range)*(H-pad*2);
  html+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:120px;">';
  html+='<defs><linearGradient id="gmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>';
  html+='<polygon points="'+areaPts+'" fill="url(#gmg)"/>';
  html+='<polyline points="'+linePts+'" fill="none" stroke="var(--green)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  html+='<line x1="'+pad+'" y1="'+avgY+'" x2="'+(W-pad)+'" y2="'+avgY+'" stroke="var(--orange)" stroke-width="1" stroke-dasharray="4,3"/>';
  html+='<text x="'+(W-pad-4)+'" y="'+(avgY-3)+'" text-anchor="end" font-size="9" fill="var(--orange)">平均 '+avg+'</text>';
  // 数据点
  gmvArr.forEach((v,i)=>{
    const px=pad+stepX*i,py=H-pad-((v-minV)/range)*(H-pad*2);
    html+='<circle cx="'+px+'" cy="'+py+'" r="3" fill="'+(v===maxV?'var(--orange)':'var(--green)')+'" onclick="showToast(\''+hist[i].date+': ₽'+v+'\')"><title>'+hist[i].date+' : ₽'+v+'</title></circle>';
  });
  html+='</svg>';
  html+='<div style="display:flex;gap:2px;">';
  hist.forEach(d=>{const dt=new Date(d.date);html+='<div class="chart-label" style="flex:1">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div>'});
  html+='</div><div style="display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--text3);"><span>🔵 峰值 ₽'+maxV+'</span><span>⚪ 平均 ₽'+avg+'</span></div></div>';

  // 本周汇总
  html+='<div class="sh-r"><div class="sh-t"><span class="e">📈</span>本周汇总（7天）</div></div>';
  html+='<div class="stats">';
  html+='<div class="stat"><div class="n" style="font-size:16px">₽'+weekGMV.toLocaleString()+'</div><div class="l">GMV</div></div>';
  html+='<div class="stat"><div class="n" style="font-size:16px">'+weekOrders+'</div><div class="l">订单</div></div>';
  html+='<div class="stat"><div class="n" style="font-size:16px">¥'+Math.round(avgOrderValue*DB.get('rubRate',12.5))+'</div><div class="l">客单价(¥)</div></div>';
  html+='</div>';
  html+='<div class="cd cd-soft"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-size:13px;color:var(--green-t);"><b>转化率</b> '+weekCVR+'%</div><div style="font-size:13px;color:var(--green-t);"><b>平均日GMV</b> ₽'+Math.round(weekGMV/7).toLocaleString()+'</div></div></div>';

  // 手动录入
  html+='<div class="sh-r"><div class="sh-t"><span class="e">✏️</span>手动录入今日数据</div></div>';
  html+='<div class="cd"><div class="fg"><label class="fl">GMV (₽)</label><input type="number" class="fi" id="kpi-gmv" value="'+(today.gmv||'')+'" placeholder="如 15000"></div><div class="fg"><label class="fl">订单数</label><input type="number" class="fi" id="kpi-ord" value="'+(today.orders||'')+'" placeholder="如 25"></div><div class="fg"><label class="fl">浏览量</label><input type="number" class="fi" id="kpi-view" value="'+(today.views||'')+'" placeholder="如 800"></div><div class="fg"><label class="fl">访客数</label><input type="number" class="fi" id="kpi-vis" value="'+(today.visitors||'')+'" placeholder="如 400"></div><button class="btn btn-p btn-blk" onclick="saveKPI()">保存数据</button>';
  if(apiOk)html+='<button class="btn btn-blk" style="margin-top:8px;" onclick="syncOzonData()">🔄 从Ozon API同步</button>';
  html+='</div>';

  // 转化率
  if(today.views&&today.orders){
    const cvr=Math.round(today.orders/today.views*100*100)/100;
    html+='<div class="cd cd-soft"><div style="font-size:13px;color:var(--green-t);margin-bottom:4px;">💡 今日转化率</div><div style="font-size:24px;font-weight:700;color:var(--green-d);">'+cvr+'%</div><div style="font-size:11px;color:var(--text2);">'+today.orders+'单 / '+today.views+'浏览</div></div>';
  }
  document.getElementById('pg-dashboard').innerHTML=html;
};

function saveKPI(){
  saveManualKPI({
    gmv:parseInt(val('kpi-gmv'))||0,
    orders:parseInt(val('kpi-ord'))||0,
    views:parseInt(val('kpi-view'))||0,
    visitors:parseInt(val('kpi-vis'))||0
  });
  showToast('✅ 数据已保存');RENDER.dashboard();
}

async function syncOzonData(){
  showToast('🔄 正在同步Ozon数据...');
  const now=new Date();const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const data=await ozonAPI('/v1/analytics/data',{
    date_from:todayStart.toISOString(),
    date_to:now.toISOString(),
    metrics:['revenue','orders_count','views_count'],
    dimension:'day'
  });
  if(data&&data.result&&data.result.length){
    const d=data.result[0];
    saveManualKPI({gmv:Math.round(d.metrics&&d.metrics.revenue||0),orders:d.metrics&&d.metrics.orders_count||0,views:d.metrics&&d.metrics.views_count||0});
    showToast('✅ Ozon数据已同步');RENDER.dashboard();
  }else{
    showToast('⚠️ 未获取到数据，请检查API配置');
  }
}

// 4. 利润计算 —— 自动测算引擎
// 完整成本模型：采购 + 佣金 + 物流 + 广告 + 汇率损耗
function calcProfit(p,rate,cfg){
  rate=rate||DB.get('rubRate',12.5);
  cfg=cfg||DB.get('profitCfg',{commission:15,logistics:0,ads:0,lossRate:0.5,extra:0});
  const revenue=p.price*rate;                    // 售价折人民币
  const commission=revenue*cfg.commission/100;   // Ozon佣金（按营收比例）
  const logistics=cfg.logistics||0;              // 每单固定物流费(¥)
  const ads=cfg.ads||0;                          // 每单广告费(¥)
  const loss=revenue*cfg.lossRate/100;           // 汇损+退款损耗(¥)
  const cost=(p.cost||0)+commission+logistics+ads+loss+ (cfg.extra||0);
  const profit=revenue-cost;
  const margin=revenue?profit/revenue*100:0;
  return {revenue,commission,logistics,ads,loss,cost,profit,margin,verdict:margin>=30?'优':margin>=15?'可':'低'};
}
// 一键评测：填入售价实时算出是否值得卖
function evalProfit(){
  const rate=parseFloat(val('pe-rate'))||DB.get('rubRate',12.5);
  const price=parseFloat(val('pe-price'));
  const cost=parseFloat(val('pe-cost'))||0;
  const cfg=DB.get('profitCfg',{commission:15,logistics:0,ads:0,lossRate:0.5,extra:0});
  const fakeP={price:price,cost:cost};
  const box=document.getElementById('pe-result');
  if(!price){box.innerHTML='<div style="font-size:12px;color:var(--text3);">输入售价后自动测算</div>';return}
  const r=calcProfit(fakeP,rate,cfg);
  const color=r.margin>=30?'var(--green-d)':r.margin>=15?'var(--orange)':'var(--red)';
  const verdict=r.margin>=30?'✅ 值得卖':r.margin>=15?'⚖️ 可接受':'❌ 不建议卖';
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;"><div><div style="font-size:12px;color:var(--text3);">售价折人民币</div><div style="font-size:18px;font-weight:700;">¥'+Math.round(r.revenue)+'</div></div><div><div style="font-size:12px;color:var(--text3);">净利润</div><div style="font-size:18px;font-weight:700;color:'+color+';">¥'+Math.round(r.profit)+'</div></div><div><div style="font-size:12px;color:var(--text3);">净利率</div><div style="font-size:18px;font-weight:700;color:'+color+';">'+r.margin.toFixed(1)+'%</div></div></div><div style="text-align:center;padding:8px;background:'+(r.margin>=30?'var(--green-s)':r.margin>=15?'var(--orange-s)':'rgba(239,68,68,.08)')+';border-radius:8px;font-weight:700;color:'+color+';">'+verdict+'</div><div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.6;">明细：采购¥'+cost+' · 佣金¥'+Math.round(r.commission)+' · 物流¥'+(r.logistics||0)+' · 广告¥'+(r.ads||0)+' · 汇损¥'+Math.round(r.loss)+'</div>';
}

function ru2html(s){return s}

function speakWord(w,lang){
  lang=lang||'en-US';
  if('speechSynthesis'in window){
    const u=new SpeechSynthesisUtterance(w);u.lang=lang;u.rate=0.8;
    speechSynthesis.speak(u);
  }else{showToast('不支持朗读')}
}

var _recog=null,_recWord='';
function startRecord(w){
  _recWord=w.toLowerCase().replace(/[^a-z]/g,'');
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('⚠️ 请用Safari打开使用录音功能');return}
  if(_recog){try{_recog.stop()}catch(e){}}
  _recog=new SR();_recog.lang='en-US';_recog.continuous=false;_recog.interimResults=false;
  showToast('🎙 请朗读：'+w);
  _recog.onstart=function(){showToast('🔴 录音中...')};
  _recog.onerror=function(e){showToast('⚠️ '+(e.error==='not-allowed'?'请允许麦克风':e.error==='no-speech'?'没检测到声音':'识别失败'))};
  _recog.onresult=function(e){
    var heard=e.results[0][0].transcript.toLowerCase().replace(/[^a-z]/g,'');
    var target=_recWord;
    var match=0,total=Math.max(heard.length,target.length);
    for(var i=0;i<Math.min(heard.length,target.length);i++){if(heard[i]===target[i])match++}
    var score=Math.round(match/total*100);
    var correct=score>=70;
    var h='<div class="modal-bg on" id="rec-modal" style="z-index:9999" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:340px;"><div style="text-align:center;padding:20px;"><div style="font-size:48px;">'+(correct?'🎉':'💪')+'</div><div style="font-size:18px;font-weight:700;color:'+(correct?'var(--green-d)':'var(--orange)')+';margin:8px 0;">'+(correct?'发音很棒！':'继续练习')+'</div><div style="background:var(--green-s);border-radius:10px;padding:12px;margin:8px 0;text-align:left;"><div style="font-size:11px;color:var(--text3);">🎯 目标</div><div style="font-size:16px;font-weight:600;color:var(--green-t);">'+esc(w)+'</div></div><div style="background:'+(correct?'var(--green-s)':'var(--orange-s)')+';border-radius:10px;padding:12px;margin:8px 0;text-align:left;"><div style="font-size:11px;color:var(--text3);">🎤 你读的</div><div style="font-size:16px;font-weight:600;color:'+(correct?'var(--green-t)':'var(--orange)')+';">'+esc(e.results[0][0].transcript)+'</div></div><div style="font-size:28px;font-weight:700;color:'+(correct?'var(--green-d)':'var(--orange)')+';margin:12px 0;">'+score+'分</div><button class="word-btn" style="width:100%;padding:12px;" onclick="document.getElementById(\'rec-modal\').remove();startRecord(\''+w+'\')">🎙 再试一次</button></div></div></div>';
    var old=document.getElementById('rec-modal');if(old)old.remove();
    document.body.insertAdjacentHTML('beforeend',h);
  };
  try{_recog.start()}catch(e){showToast('请稍后再试')}
}

function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>showToast('📋 已复制'))}else{showToast('请手动复制')}}

// ========== 提醒开关 ==========
function enableNotify(){
  if(!('Notification'in window)){showToast('⚠️ 当前浏览器不支持通知');return}
  Notification.requestPermission().then(function(p){
    if(p==='granted'){showToast('✅ 通知已开启');RENDER.settings()}
    else{showToast('❌ 通知被拒绝，请在浏览器设置中开启')}
  });
}
function toggleRemind(key){
  const cfg=DB.get('remindCfg',{});
  cfg[key]=!(cfg[key]!==false); // 翻转
  DB.set('remindCfg',cfg);
  RENDER.settings();
}

  DB.set('ozonCreds',{clientId:val('set-clientid').trim(),apiKey:val('set-apikey').trim()});

function toggleDark(){

  DB.set('darkMode',cur);
  document.documentElement.classList.toggle('dark',cur);

function applyTheme(){
  document.documentElement.classList.toggle('dark',DB.get('darkMode',false));
}
function exportData(){
  const all={};Object.keys(localStorage).forEach(k=>{if(k.startsWith('oz_'))all[k]=localStorage.getItem(k)});
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ozon_workbench_backup.json';a.click();
  showToast('✅ 数据已导出');
}

// 数据导入
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const data=JSON.parse(ev.target.result);
        Object.keys(data).forEach(k=>{if(k.startsWith('oz_'))localStorage.setItem(k,data[k])});
        showToast('✅ 数据已导入');location.reload();
      }catch(err){showToast('❌ 文件格式错误')}
    };
    reader.readAsText(file);
  };
  inp.click();
}

function clearData(){
  if(!confirm('确定清除全部数据？此操作不可恢复！'))return;
  Object.keys(localStorage).forEach(k=>{if(k.startsWith('oz_'))localStorage.removeItem(k)});
  showToast('已清除');location.reload();
}
