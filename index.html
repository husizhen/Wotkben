<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

<style>
:root {
  --green: #5BA888;
  --green-dark: #4A8C70;
  --green-light: #8DD5B0;
  --green-soft: #E0F3E9;
  --green-bg: #F2F9F4;
  --green-bg2: #E8F5EE;
  --green-text: #2D5C46;
  --orange: #FF9F43;
  --orange-soft: #FFF3E0;
  --blue: #4A90D9;
  --blue-soft: #E3F2FD;
  --red: #FF6B6B;
  --purple: #AB47BC;
  --purple-soft: #F3E5F5;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #999;
  --white: #fff;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px;
  --sh: 0 1px 6px rgba(91,168,136,0.08);
  --sh2: 0 2px 12px rgba(91,168,136,0.12);
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:var(--green-bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{min-height:100vh}
::-webkit-scrollbar{display:none}
.hdr{background:var(--green);padding:calc(var(--safe-t)+10px) 14px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;color:#fff;border-radius:0 0 20px 20px;box-shadow:0 2px 8px rgba(91,168,136,0.2)}
.hdr .menu{background:rgba(255,255,255,.2);border:none;width:36px;height:36px;border-radius:10px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hdr .tt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
.hdr .dt{font-size:12px;opacity:.9}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--green-soft);z-index:200;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding-top:var(--safe-t);border-right:1px solid var(--green-light)}
.drawer.on{transform:translateX(0)}
.drawer-hd{padding:16px;background:var(--green);color:#fff;border-radius:0 0 16px 16px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.drawer-av{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.drawer-nm{font-size:14px;font-weight:600}
.drawer-sub{font-size:11px;opacity:.85}
.drawer-nav{flex:1;overflow-y:auto;padding:6px 8px}
.dn-item{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:3px;border-radius:12px;cursor:pointer;transition:all .15s;color:var(--text2);font-size:14px}
.dn-item .e{font-size:18px;width:24px;text-align:center}
.dn-item.on{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(91,168,136,.3)}
.dn-item:active{transform:scale(.98)}
.drawer-ft{padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--green-light);font-size:10px;color:var(--text3);text-align:center}
.pg{display:none;padding:12px 14px 90px;animation:fi .3s ease}
.pg.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cd{background:var(--white);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.cd-soft{background:var(--green-soft)}
.cd-green{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff}
.cd-orange{background:linear-gradient(135deg,var(--orange),#FF8C42);color:#fff}
.sh-r{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;margin-bottom:8px}
.sh-t{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--green-text)}
.sh-t .e{font-size:18px}
.sh-a{font-size:12px;color:var(--green-dark);cursor:pointer;font-weight:500}
.btn{border:none;border-radius:var(--r-md);padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.btn-p{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(91,168,136,.3)}
.btn-p:active{transform:scale(.97)}
.btn-o{background:transparent;border:1.5px solid var(--green);color:var(--green-dark)}
.btn-blk{width:100%}
.btn-pill{border-radius:999px}
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--green-soft)}
.task:last-child{border-bottom:none}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--green-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s;background:#fff}
.ck.on{background:var(--green);border-color:var(--green)}
.ck svg{width:14px;height:14px;color:#fff;opacity:0}
.ck.on svg{opacity:1}
.task .tx{flex:1;font-size:14px}
.task.done .tx{text-decoration:line-through;color:var(--text3)}
.task .tm{font-size:11px;color:var(--text3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:11px;color:var(--text3);padding:4px 0}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:8px;cursor:pointer;transition:all .15s}
.cal-d.chk{background:var(--green);color:#fff;font-weight:600}
.cal-d.today{border:2px solid var(--green);font-weight:600;color:var(--green-dark)}
.cal-d.fut{color:var(--text3);opacity:.4}
.cal-d:active{transform:scale(.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;font-size:13px;background:#fff;color:var(--text2);cursor:pointer;border:1.5px solid transparent;transition:all .15s;display:flex;align-items:center;gap:4px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--green-bg);width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px+var(--safe-b));max-height:88vh;overflow-y:auto;animation:su .3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--green-light)}
.modal-tt{font-size:16px;font-weight:600;color:var(--green-text)}
.modal-x{background:var(--green-soft);border:none;width:30px;height:30px;border-radius:50%;font-size:18px;color:var(--green-text);cursor:pointer}
.fg{margin-bottom:14px}
.fl{font-size:13px;color:var(--green-text);margin-bottom:6px;display:block;font-weight:500}
.fi,.fta,.fs{width:100%;padding:11px 14px;border:1.5px solid var(--green-light);border-radius:var(--r-sm);font-size:14px;color:var(--text);background:#fff;font-family:inherit;outline:none}
.fi:focus,.fta:focus,.fs:focus{border-color:var(--green)}
.fta{resize:none;min-height:70px}
.pg-bar{height:8px;background:var(--green-soft);border-radius:4px;overflow:hidden}
.pg-fill{height:100%;background:var(--green);border-radius:4px;transition:width .5s}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:#fff;border-radius:var(--r-md);padding:14px;text-align:center;box-shadow:var(--sh)}
.stat .n{font-size:22px;font-weight:700;color:var(--green-dark)}
.stat .l{font-size:11px;color:var(--text2);margin-top:2px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
.empty{text-align:center;padding:30px 20px;color:var(--text3)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty .t{font-size:13px}
.word-card{background:#fff;border-radius:var(--r-md);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.word-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.word-en{font-size:18px;font-weight:700;color:var(--green-text)}
.word-phon{font-size:12px;color:var(--text3)}
.word-cn{font-size:14px;color:var(--text2);margin-bottom:8px}
.word-actions{display:flex;gap:8px}
.word-btn{background:var(--green-soft);border:none;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--green-dark);cursor:pointer;display:flex;align-items:center;gap:4px}
.article{background:#fff;border-radius:var(--r-md);padding:14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;transition:all .15s}
.article:active{transform:scale(.98)}
.article .at{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.4}
.article .am{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.article .atag{font-size:10px;padding:2px 8px;border-radius:6px;background:var(--green-soft);color:var(--green-dark)}
.outfit-card{background:#fff;border-radius:var(--r-md);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.outfit-cover{height:160px;display:flex;align-items:center;justify-content:center;font-size:50px}
.outfit-info{padding:14px}
.outfit-tt{font-size:14px;font-weight:600;margin-bottom:6px}
.outfit-desc{font-size:12px;color:var(--text2);line-height:1.5}
.fin-sum{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:12px;box-shadow:var(--sh2)}
.fin-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--green-soft)}
.fin-item:last-child{border-bottom:none}
.fin-ic{width:36px;height:36px;border-radius:10px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.fin-nm{flex:1;font-size:14px}
.fin-am{font-size:14px;font-weight:600}
.fin-am.in{color:var(--green-dark)}
.fin-am.out{color:var(--red)}
.sc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sc-item{padding:14px;border-radius:var(--r-md);background:#fff;box-shadow:var(--sh);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px}
.sc-item:active{transform:scale(.97)}
.sc-item .e{font-size:26px}
.sc-item .t{font-size:13px;font-weight:600}
.sc-item .d{font-size:11px;color:var(--text3)}
.chat-area{max-height:50vh;overflow-y:auto;padding:8px 0;margin-bottom:10px}
.chat-msg{display:flex;gap:8px;margin-bottom:12px}
.chat-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-msg.bot .chat-av{background:var(--green-soft)}
.chat-msg.me{flex-direction:row-reverse}
.chat-msg.me .chat-av{background:var(--orange-soft)}
.chat-bb{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word}
.chat-msg.bot .chat-bb{background:#fff;color:var(--text);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.chat-msg.me .chat-bb{background:var(--green);color:#fff;border-bottom-right-radius:4px}
.chat-sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chat-sug .chip{font-size:12px;background:var(--green-soft);color:var(--green-dark);cursor:pointer}
.chat-in{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--green-soft)}
.chat-input{flex:1;padding:10px 14px;border:1.5px solid var(--green-light);border-radius:999px;font-size:14px;outline:none;font-family:inherit}
.chat-input:focus{border-color:var(--green)}
.chat-send{background:var(--green);color:#fff;border:none;border-radius:999px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer}
.vid-card{background:#fff;border-radius:var(--r-md);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer;transition:all .15s}
.vid-card:active{transform:scale(.98)}
.vid-cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.vid-dur{position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.7);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px}
.vid-info{padding:12px}
.vid-tt{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.4}
.vid-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
</style>
</head>

  cal+='</div>';

function speakWord(w){if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u)}else{showToast('不支持朗读')}}
var _recog=null,_recWord='';
function startRecord(w){
  _recWord=w.toLowerCase().replace(/[^a-z]/g,'');
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('⚠️ 当前浏览器不支持语音识别，请用Safari打开');return}
  if(_recog){try{_recog.stop()}catch(e){}}
  _recog=new SR();
  _recog.lang='en-US';
  _recog.continuous=false;
  _recog.interimResults=false;
  _recog.maxAlternatives=3;
  showToast('🎙 请朗读：'+w);
  _recog.onstart=function(){showToast('🔴 录音中...请大声朗读')};
  _recog.onerror=function(e){
    if(e.error==='not-allowed')showToast('⚠️ 请允许麦克风权限');
    else if(e.error==='no-speech')showToast('⚠️ 没有检测到声音，请再试');
    else showToast('⚠️ 识别失败：'+e.error);
  };
  _recog.onresult=function(e){
    var heard=e.results[0][0].transcript.toLowerCase().replace(/[^a-z]/g,'');
    var target=_recWord;
    var correct=true;
    // Simple comparison: check if heard contains target or is similar
    if(heard===target){correct=true}
    else if(heard.length>0&&target.indexOf(heard)>=0){correct=true}
    else if(heard.length>0&&heard.indexOf(target)>=0){correct=true}
    else{
      // Character-level similarity
      var match=0,total=Math.max(heard.length,target.length);
      for(var i=0;i<Math.min(heard.length,target.length);i++){if(heard[i]===target[i])match++}
      correct=(match/total>=0.7);
    }
    var score=Math.round(correct?100:(heard.length>0?60:0));
    var html='<div class="modal-bg on" id="rec-modal" style="z-index:9999" onclick="if(event.target===this)this.remove()"><div class="modal" style="max-width:340px;"><div style="text-align:center;padding:20px;">';
    html+='<div style="font-size:48px;margin-bottom:8px;">'+(correct?'🎉':'💪')+'</div>';
    html+='<div style="font-size:18px;font-weight:700;color:'+(correct?'var(--green-dark)':'var(--orange)')+';margin-bottom:12px;">'+(correct?'发音很棒！':'继续练习')+'</div>';
    html+='<div style="background:var(--green-soft);border-radius:12px;padding:14px;margin-bottom:10px;text-align:left;">';
    html+='<div style="font-size:12px;color:var(--text3);margin-bottom:4px;">🎯 目标单词</div>';
    html+='<div style="font-size:18px;font-weight:600;color:var(--green-text);">'+esc(w)+'</div>';
    html+='</div>';
    html+='<div style="background:'+(correct?'var(--green-soft)':'var(--orange-soft)')+';border-radius:12px;padding:14px;margin-bottom:10px;text-align:left;">';
    html+='<div style="font-size:12px;color:var(--text3);margin-bottom:4px;">🎤 你读的是</div>';
    html+='<div style="font-size:18px;font-weight:600;color:'+(correct?'var(--green-text)':'var(--orange)')+';">'+esc(e.results[0][0].transcript)+'</div>';
    html+='</div>';
    html+='<div style="font-size:28px;font-weight:700;color:'+(correct?'var(--green-dark)':'var(--orange)')+';margin-bottom:16px;">'+score+'分</div>';
    html+='<div style="display:flex;gap:8px;"><button class="word-btn" style="flex:1;padding:12px;" onclick="document.getElementById(\'rec-modal\').remove();speakWord(\''+w+'\')">🔊 再听原声</button>';
    html+='<button class="word-btn" style="flex:1;padding:12px;background:var(--green);color:#fff;" onclick="document.getElementById(\'rec-modal\').remove();startRecord(\''+w+'\')">🎙 再试一次</button></div>';
    html+='</div></div></div>';
    var old=document.getElementById('rec-modal');if(old)old.remove();
    document.body.insertAdjacentHTML('beforeend',html);
  };
  try{_recog.start()}catch(e){showToast('⚠️ 请稍后再试')}
}
